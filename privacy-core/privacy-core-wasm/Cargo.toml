[package]
name = "privacy-core-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "wasm-bindgen surface of privacy-core for the web wallet and node: byte-array in, byte-array out"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
privacy-core = { path = "../privacy-core" }
wasm-bindgen = "=0.2.117"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
