[workspace]
resolver = "2"
members = ["privacy-core", "privacy-core-wasm", "privacy-prover", "privacy-ffi", "uniffi-bindgen"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Proving is MSMs and FFTs and the witness is an interpreter run: unoptimized they take minutes (and the
# interpreter overflows a test thread stack). Test builds compile the prover, arkworks and wasmi optimized.
[profile.dev.package.privacy-prover]
opt-level = 3
[profile.dev.package.ark-ff]
opt-level = 3
[profile.dev.package.ark-ec]
opt-level = 3
[profile.dev.package.ark-poly]
opt-level = 3
[profile.dev.package.ark-groth16]
opt-level = 3
[profile.dev.package.ark-bn254]
opt-level = 3
[profile.dev.package.ark-std]
opt-level = 3
[profile.dev.package.wasmi]
opt-level = 3
[profile.dev.package.wasmi_core]
opt-level = 3
[profile.dev.package.wasmi_ir]
opt-level = 3
[profile.dev.package.wasmi_collections]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
