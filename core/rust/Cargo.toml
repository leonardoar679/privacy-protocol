[workspace]
resolver = "2"
members = ["privacy-core", "privacy-core-wasm", "privacy-prover"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Proving is MSMs and FFTs: unoptimized they take minutes. Test builds compile the prover and the
# arkworks crates optimized (the rest of the workspace keeps fast debug builds).
[profile.dev.package.privacy-prover]
opt-level = 3
[profile.dev.package.ark-ff]
opt-level = 3
[profile.dev.package.ark-ec]
opt-level = 3
[profile.dev.package.ark-poly]
opt-level = 3
[profile.dev.package.ark-groth16]
opt-level = 3
[profile.dev.package.ark-bn254]
opt-level = 3
[profile.dev.package.ark-std]
opt-level = 3
