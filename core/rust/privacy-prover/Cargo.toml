[package]
name = "privacy-prover"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Groth16 prover for the Transaction circuit: reads the snarkjs proving key (.zkey) and witness (.wtns), proves with arkworks, exports the proof exactly as the contracts consume it"

[lib]
crate-type = ["rlib"]

[dependencies]
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ec = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }
ark-poly = { version = "0.5", default-features = false }
ark-groth16 = { version = "0.5", default-features = false }
ark-relations = { version = "0.5", default-features = false }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

# Native hosts (phones, desktops) prove on every core: arkworks' MSMs and FFTs through rayon. The
# wasm32 build keeps the single-threaded, std-free configuration (resolver 2 ignores these features there).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ark-groth16 = { version = "0.5", default-features = false, features = ["parallel"] }
