[package]
name = "privacy-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Privacy Protocol crypto core: Poseidon2 (BN254), notes, nullifiers, Merkle, payload binding, envelope, privacy address - shared by the mobile, desktop and WASM wallets"

[lib]
crate-type = ["rlib"]

[dependencies]
ark-bn254 = { version = "0.5", default-features = false, features = ["scalar_field"] }
ark-ff = { version = "0.5", default-features = false }
sha3 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
scrypt = { version = "0.11", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = { version = "0.12", default-features = false }
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "alloc"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
ripemd = { version = "0.1", default-features = false }
unicode-normalization = { version = "0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hex = "0.4"
