# The offline gates on every push to main and every pull request (V6 Stage 2; Privacy Wallet Web spec v2.0 §17, doc
# §69 and §83): the lockfile check, `npm ci`, then `scripts/verify-all.mjs --ci` — the typecheck of every workspace,
# lint, import case, documentation paths, the unit suites, the privacy-leakage gate, the build with its pins, forge, the
# dependency audit and the dependency review against the parent commit.
# Not here, by design (they run on a workstation through verify-all): the Rust core (--rust: an offline vendored crate
# set), the live suites (--live: provider quota and keys), the screenshot harness (--browser: baselines are per
# platform) and the local-stack browser run (a devnet, the services, a browser).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # the Private AI SDK is a separate clone (docs/private-ai.md): without it the build carries the stub that says so
      ZKAPI_SDK_DIR: /nonexistent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the dependency review compares the lockfile with the parent commit
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.4
      - name: lockfile check (before anything is installed)
        run: node scripts/check-lockfile.mjs
      - run: npm ci --no-audit --no-fund
      - name: verify-all --ci
        run: node scripts/verify-all.mjs --ci --forge 0.8.24

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
